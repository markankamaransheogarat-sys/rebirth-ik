[workspace]
resolver = "2"
members = ["crates/rebirth-ik", "crates/rebirth-ik-wasm"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/markankamaransheogarat-sys/rebirth-ik"
authors = ["markankamaransheogarat-sys"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
