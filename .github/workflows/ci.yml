name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features
      - run: cargo test -p rebirth-ik --no-default-features --features libm --lib

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo doc -p rebirth-ik --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  targets:
    name: no_std + wasm builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Cortex-M4F (no_std)
        run: cargo build -p rebirth-ik --no-default-features --features libm --target thumbv7em-none-eabihf --release
      - name: WebAssembly
        run: cargo build -p rebirth-ik-wasm --target wasm32-unknown-unknown --release
      - name: Benchmarks compile
        run: cargo bench -p rebirth-ik --features rayon --no-run
