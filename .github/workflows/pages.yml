name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build WebAssembly
        run: cargo build -p rebirth-ik-wasm --target wasm32-unknown-unknown --release
      - name: Install wasm-bindgen CLI matching Cargo.lock
        run: |
          V=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | cut -d'"' -f2)
          echo "wasm-bindgen $V"
          cargo install wasm-bindgen-cli --version "$V" --locked
      - name: Generate JS glue
        run: wasm-bindgen --target web --out-dir web/pkg --no-typescript target/wasm32-unknown-unknown/release/rebirth_ik_wasm.wasm
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
